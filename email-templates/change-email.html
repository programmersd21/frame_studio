<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm email change</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;padding:40px 20px">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="max-width:100%">
          <tr>
            <td style="padding-bottom:24px;text-align:center">
              <span style="font-size:22px;font-weight:700;letter-spacing:-0.5px;color:#1d1d1f">Frame Studio</span>
            </td>
          </tr>
          <tr>
            <td style="background:#ffffff;border-radius:20px;padding:40px 36px;box-shadow:0 8px 32px rgba(0,0,0,0.06)">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="text-align:center;padding-bottom:24px">
                    <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#34c759,#28a745);display:inline-flex;align-items:center;justify-content:center">
                      <span style="color:#fff;font-size:28px;line-height:1">✉</span>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding-bottom:8px">
                    <h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.3px;color:#1d1d1f">Confirm email change</h1>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding-bottom:24px">
                    <p style="margin:0;font-size:15px;line-height:1.5;color:#86868b">Click the button below to confirm your new email address.</p>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding-bottom:8px">
                    <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email_change" style="display:inline-block;padding:14px 32px;border-radius:14px;background:#0071e3;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;box-shadow:0 4px 14px rgba(0,113,227,0.3)">
                      Confirm Email
                    </a>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding-top:20px">
                    <p style="margin:0;font-size:13px;color:#a1a1a6;line-height:1.4">
                      Or paste this link in your browser:<br>
                      <span style="color:#86868b;word-break:break-all">{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email_change</span>
                    </p>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding-top:24px;border-top:1px solid #f0f0f0;margin-top:24px">
                    <p style="margin:0;font-size:12px;color:#a1a1a6;line-height:1.4">
                      Didn't request this? Ignore this email.<br>
                      Frame Studio &middot; AI motion graphics
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
