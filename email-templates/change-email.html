<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm email change</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f7;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;padding:40px 20px" role="presentation">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="max-width:100%" role="presentation">
          <tr>
            <td style="padding-bottom:24px;text-align:center">
              <span style="font-size:20px;font-weight:700;letter-spacing:-0.5px;color:#1d1d1f">Frame Studio</span>
            </td>
          </tr>
          <tr>
            <td style="background:#ffffff;border-radius:20px;padding:36px 32px;box-shadow:0 8px 32px rgba(0,0,0,0.06),inset 0 1px 0 0 rgba(255,255,255,0.9)">
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td style="text-align:center;padding-bottom:20px">
                    <table cellpadding="0" cellspacing="0" style="margin:0 auto" role="presentation">
                      <tr>
                        <td style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#34c759,#28a745);text-align:center;vertical-align:middle">
                          <span style="color:#ffffff;font-size:24px;line-height:52px;font-weight:600">✉</span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding-bottom:6px">
                    <h1 style="margin:0;font-size:21px;font-weight:600;letter-spacing:-0.3px;color:#1d1d1f">Confirm email change</h1>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding-bottom:24px">
                    <p style="margin:0;font-size:14px;line-height:1.6;color:#86868b">Click the button below to confirm your new email address.</p>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding-bottom:8px">
                    <table cellpadding="0" cellspacing="0" style="margin:0 auto" role="presentation">
                      <tr>
                        <td style="border-radius:12px;background:#0071e3;padding:0;box-shadow:0 4px 14px rgba(0,113,227,0.3)">
                          <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email_change" style="display:inline-block;padding:13px 32px;border-radius:12px;background:#0071e3;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;letter-spacing:-0.01em">Confirm Email</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding-top:16px">
                    <p style="margin:0;font-size:12px;color:#a1a1a6;line-height:1.5">Or copy this link:<br>
                    <span style="color:#86868b;word-break:break-all;font-size:11px">{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email_change</span></p>
                  </td>
                </tr>
                <tr>
                  <td style="padding-top:24px;border-top:1px solid #f0f0f0;margin-top:24px;text-align:center">
                    <p style="margin:0;font-size:11px;color:#a1a1a6;line-height:1.5">Didn't request this? Ignore this email.<br>
                    Frame Studio &mdash; AI motion graphics</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
